# Vendored, curated, pre-tagged subset of SecLists (plan §9/§12).
#
# Same shape and rationale as the PayloadsAllTheThings subset: stable
# `payload_ref` handles paired with the full six-field ReachAgent tag schema, no
# inlined exploit text (§9), vendored so detection stays network-free and tests
# stay reproducible (CLAUDE.md). Untagged / un-mappable rows are unloadable
# (PayloadLibraryError); corpora expand the payload SET only, never what counts
# as confirmed — every payload still routes through run_oracle.
#
# Provenance: danielmiessler/SecLists (MIT). SecLists is fuzzing-wordlist shaped,
# so this subset takes the injection/fuzzing lists that map cleanly onto an
# existing sink + §7 oracle; wordlist entries with no deterministic oracle
# (generic discovery/brute lists) are intentionally NOT ingested — they have no
# honest confirmation path.
source: SecLists
upstream: https://github.com/danielmiessler/SecLists
payloads:
  # -- SQLi fuzzing list (Fuzzing/SQLi) -------------------------------------
  - vuln_class: sqli
    context: >-
      Generic SQLi fuzz vector: a quote/comment/operator meta-string from the
      SQLi fuzzing list that provokes a DB error signature. Differential diff.
    inferred_sink_type: sql
    oracle_type: differential
    payload_ref: seclists/fuzzing/sqli/generic-meta-strings
    graph_edge_on_success: enables

  - vuln_class: sqli_blind
    context: >-
      Time-based blind SQLi fuzz vector from the SQLi fuzzing list. Paired-trial
      with a negative control; sorts last (statistical noise ceiling, §5).
    inferred_sink_type: sql
    oracle_type: timing_statistical
    payload_ref: seclists/fuzzing/sqli/time-based-vectors
    graph_edge_on_success: enables

  # -- NoSQL fuzzing list (Fuzzing/Databases) -------------------------------
  - vuln_class: nosqli
    context: >-
      NoSQL operator fuzz vector from the SecLists NoSQL list — a selector
      operator submitted as structured input to bypass auth. Differential.
    inferred_sink_type: nosql
    oracle_type: differential
    payload_ref: seclists/fuzzing/nosql/operator-vectors
    graph_edge_on_success: derived_credential

  # -- LDAP fuzzing list (Fuzzing/LDAP.fuzzdb) -------------------------------
  - vuln_class: ldapi
    context: >-
      LDAP injection fuzz vector from the SecLists LDAP list — filter
      metacharacters that alter the intended bind/search filter. Differential.
    inferred_sink_type: ldap
    oracle_type: differential
    payload_ref: seclists/fuzzing/ldap/filter-metachars
    graph_edge_on_success: derived_credential

  # -- Command injection list (Fuzzing/command-injection) -------------------
  - vuln_class: command_injection
    context: >-
      OS command-injection fuzz vector from the SecLists command-injection list:
      a separator chaining an out-of-band lookup. OOB callback confirms.
    inferred_sink_type: shell
    oracle_type: oob_callback
    payload_ref: seclists/fuzzing/command-injection/oob-separators
    graph_edge_on_success: enables

  # -- SSTI list (Fuzzing/template-engines) ---------------------------------
  - vuln_class: ssti
    context: >-
      Template-engine fuzz expression from the SecLists SSTI list that renders to
      its evaluated value, proving server-side evaluation. Execution-confirmed.
    inferred_sink_type: template
    oracle_type: execution_confirmation
    payload_ref: seclists/fuzzing/ssti/template-eval-expressions
    graph_edge_on_success: enables

  # -- XSS list (Fuzzing/XSS) ------------------------------------------------
  - vuln_class: xss_reflected
    context: >-
      Reflected-XSS fuzz vector from the SecLists XSS list carrying a tagged
      canary handler that fires on render. Headless execution confirms.
    inferred_sink_type: html_reflection
    oracle_type: execution_confirmation
    payload_ref: seclists/fuzzing/xss/canary-handlers
    graph_edge_on_success: derived_credential

  # -- Path traversal list (Fuzzing/LFI) ------------------------------------
  - vuln_class: path_traversal
    context: >-
      LFI/traversal fuzz vector from the SecLists LFI list: an encoded dot-dot
      sequence reading an out-of-scope file. Structural — sentinel in response.
    inferred_sink_type: file_path
    oracle_type: structural
    payload_ref: seclists/fuzzing/lfi/encoded-traversal
    graph_edge_on_success: enables
