name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check src/lalo tests/lalo
      - run: uv run ruff format --check src/lalo tests/lalo
      - run: uv run mypy
      - run: uv run pytest tests/lalo -q -m "not integration"
