[project]
name = "lalo"
version = "0.1.0"
description = "L4L0 — autonomous agentic web/API + network + cloud offensive-security agent: mission-prompt-driven free-shell execution, non-blocking confidence scoring, live reachability + attack-chain graph."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Execution layer — request firing, multi-protocol (HTTP/1-3)
    "httpx[http2]>=0.28,<1.0",
    # Reachability + attack-chain graph
    "networkx>=3.4,<4.0",
    # Config / corpora
    "pyyaml>=6.0,<7.0",
    # Expose L4L0's own tools as an MCP server + external MCP client
    "mcp>=1.2,<2.0",
    # Client-side / DOM surface (browser tool)
    "playwright>=1.61.0",
    # Safe XML parsing (XXE-safe ingestion)
    "defusedxml>=0.7.1",
    # GUI (FastAPI + WebSocket)
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.30,<1.0",  # [standard] pulls in websockets - plain uvicorn has no WS protocol impl
    # Report export
    "weasyprint>=69.0",
    "html2docx>=1.6.0",
    # CVSS v3 base-score computation (compute-don't-trust)
    "cvss>=3.0,<4.0",
]

[project.scripts]
# Web GUI — the primary entry point (no CLI, no TUI).
lalo-gui = "lalo.gui.app:main"

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "pytest>=8.3,<9.0",
    "mypy>=1.13,<2.0",
    "types-networkx>=3.6.1.20260624",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lalo"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py313"
line-length = 100
# Vendored corpora are upstream files, never our code — never lint them.
exclude = ["third_party", ".claude", ".venv", "output", "logs"]

[tool.ruff.lint]
# Baseline + security lint (S = bandit-equivalent).
select = ["E", "F", "I", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Assertions, non-crypto randomness, and dummy credentials are expected in tests.
"tests/**" = ["S101", "S311", "S105", "S106", "S107"]
# Single-file HTML template — long CSS/JS lines are the minimal one-string page.
"src/lalo/gui/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/lalo"]
addopts = "-ra"
markers = [
    "integration: tests that require a real browser / external process (Playwright)",
    "live: tests that require a live target container",
]

[tool.mypy]
python_version = "3.13"
packages = ["lalo"]
strict = true

# Third-party libs without type stubs.
[[tool.mypy.overrides]]
module = ["cvss.*", "weasyprint.*", "html2docx.*"]
ignore_missing_imports = true
