# VAmPI declared surface — recon input for the Task 3 SurfaceMapper (plan §3, §6).
#
# This is grey-box recon (§16): the endpoint/parameter/object inventory a live
# OpenAPI ingest or crawl of VAmPI would produce, expressed declaratively so the
# SurfaceMapper stays generic (no per-endpoint logic baked into the mapper).
#
# `state_changing: true` marks a request the firer must NOT fire during recon
# (read-only-first, §10) — including GET /createdb, a GET that wipes the DB.
# The mapper materializes these endpoints structurally but never assumes a
# can_call status for them; authorization is confirmed later, under safety.
#
# Object sensitivity tiers follow the §4 scoring rule: 0 public, 1 user-owned,
# 2 cross-user, 3 admin/system.
endpoints:
  - method: GET
    path: /
    content_type: application/json
    returns:
      - type: status_message
        sensitivity_tier: 0

  - method: GET
    path: /createdb
    # GET that recreates the database — state-changing despite the verb (§10).
    state_changing: true

  - method: POST
    path: /users/v1/register
    content_type: application/json
    state_changing: true
    parameters:
      - name: username
        location: body
      - name: password
        location: body
      - name: email
        location: body
      # The mass-assignment sink (§5) — client-supplied admin flag.
      - name: admin
        location: body
    returns:
      - type: user
        sensitivity_tier: 2

  - method: POST
    path: /users/v1/login
    content_type: application/json
    state_changing: true
    parameters:
      - name: username
        location: body
      - name: password
        location: body

  - method: GET
    path: /users/v1
    content_type: application/json
    returns:
      - type: user
        sensitivity_tier: 2

  - method: GET
    path: /users/v1/_debug
    content_type: application/json
    returns:
      # Dumps every user WITH passwords — admin/system sensitivity.
      - type: user_credentials
        sensitivity_tier: 3

  - method: GET
    path: /users/v1/{username}
    content_type: application/json
    parameters:
      - name: username
        location: path
    returns:
      - type: user
        sensitivity_tier: 2

  - method: DELETE
    path: /users/v1/{username}
    content_type: application/json
    state_changing: true
    parameters:
      - name: username
        location: path
      - name: Authorization
        location: header

  - method: PUT
    path: /users/v1/{username}/email
    content_type: application/json
    state_changing: true
    parameters:
      - name: username
        location: path
      - name: email
        location: body
      - name: Authorization
        location: header

  - method: PUT
    path: /users/v1/{username}/password
    content_type: application/json
    state_changing: true
    parameters:
      - name: username
        location: path
      - name: password
        location: body
      - name: Authorization
        location: header

  - method: GET
    path: /books/v1
    content_type: application/json
    parameters:
      - name: Authorization
        location: header
    returns:
      - type: book
        sensitivity_tier: 2

  - method: POST
    path: /books/v1
    content_type: application/json
    state_changing: true
    parameters:
      - name: book_title
        location: body
      - name: secret
        location: body
      - name: Authorization
        location: header
    returns:
      - type: book
        sensitivity_tier: 2

  - method: GET
    path: /books/v1/{book_title}
    content_type: application/json
    parameters:
      - name: book_title
        location: path
      - name: Authorization
        location: header
    returns:
      # Returns the per-book secret — cross-user readable (BOLA target, §5).
      - type: book
        sensitivity_tier: 2
    sample_path_values:
      book_title: bookTitle77
