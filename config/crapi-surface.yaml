# crAPI declared surface — recon input for the SurfaceMapper (plan §3, §6; Phase 2 Task 6).
#
# Grey-box recon (§16): the endpoint/parameter/object inventory a live OpenAPI
# ingest of crAPI would produce (crAPI ships an OpenAPI spec), expressed
# declaratively so the SurfaceMapper stays generic — no per-endpoint logic in the
# mapper, exactly as for VAmPI.
#
# Scope: the two documented multi-step BOLA flows the Phase 2 gate scores (§14) —
# vehicle-location and mechanic-contact. Each is a *chain*: a producer hop that
# discloses another principal's object identifier, then the cross-user BOLA read
# that consumes it. crAPI's other classes (SSRF, JWT, mass assignment) are out of
# scope for this phase.
#
# `state_changing: true` marks a request the firer must NOT fire during recon
# (read-only-first, §10): the auth/onboarding calls and the contact-mechanic POST
# are onboarding/attack *setup*, established out-of-band (Task 6 seeds the session
# the same way the Phase 1 eval harness did), never fired by recon itself.
#
# Ownership on crAPI is created at runtime (a vehicle is associated to a user
# during onboarding), so an object carries an `ownership` *discovery recipe*
# (Task 2's OwnershipDiscovery), never a static owner: the mapper reads ownership
# off the app's own response to the read-only reveal, after a session exists.
#
# Object sensitivity tiers follow the §4 scoring rule: 0 public, 1 user-owned,
# 2 cross-user, 3 admin/system.
endpoints:
  # -- Auth / onboarding (state-changing: authorized setup, never recon-fired) --
  - method: POST
    path: /identity/api/auth/signup
    content_type: application/json
    state_changing: true
    parameters:
      - name: email
        location: body
      - name: password
        location: body
      - name: name
        location: body
      - name: number
        location: body

  - method: POST
    path: /identity/api/auth/login
    content_type: application/json
    state_changing: true
    parameters:
      - name: email
        location: body
      - name: password
        location: body

  # -- Vehicle-location BOLA flow -------------------------------------------
  # Producer hop: the community "recent posts" feed. It is served identically to
  # every authenticated principal and embeds each post author's `vehicleid` — a
  # cross-user identifier (tier 2). Read-only, so recon probes it safely. The
  # differential oracle confirms it as a cross-identity data exposure (two
  # distinct identities obtain the same cross-user payload), and the vehicle
  # UUIDs it discloses are exactly the identifiers the vehicle-location BOLA
  # below consumes — the genuine precondition that links the two hops.
  - method: GET
    path: /community/api/v2/community/posts/recent
    content_type: application/json
    returns:
      - type: community_feed
        sensitivity_tier: 2
        ownership:
          reveal_path: /community/api/v2/community/posts/recent
          reveal_method: GET
          requires_session: true
          # Caller-scoped: any authenticated caller is served the same feed, so a
          # non-empty 2xx reveal attributes access to the caller. Type-level (no
          # instance_key): the finding is about the endpoint exposing the feed,
          # not any one post instance.

  # The read-only "my vehicles" reveal: returns only the caller's own vehicles,
  # so it is the caller-scoped ownership reveal for the vehicle object.
  - method: GET
    path: /identity/api/v2/vehicle/vehicles
    content_type: application/json
    returns:
      - type: vehicle
        sensitivity_tier: 2
        ownership:
          reveal_path: /identity/api/v2/vehicle/vehicles
          reveal_method: GET
          requires_session: true
          # Caller-scoped: no owner_field — a 2xx reveal means the authenticated
          # caller owns the vehicle returned to them (crAPI's /vehicles model).
          # Each vehicle is a distinct instance keyed by its uuid, so two owners
          # of two vehicles get two distinct object nodes (Task 7) — the anchor
          # the vehicle-location BOLA is posed on.
          instance_key_field: uuid

  # The BOLA target: any authenticated user can read *another* user's vehicle
  # location by its vehicleId (a UUID). Templated; a sample value fills it for
  # the read-only probe. Cross-user reads are confirmed in Task 7, not here.
  - method: GET
    path: /identity/api/v2/vehicle/{vehicleId}/location
    content_type: application/json
    parameters:
      - name: vehicleId
        location: path
    returns:
      - type: vehicle_location
        sensitivity_tier: 2

  - method: GET
    path: /identity/api/v2/user/dashboard
    content_type: application/json
    returns:
      - type: user
        sensitivity_tier: 1

  # -- Mechanic-contact BOLA flow -------------------------------------------
  # The read-only "my service requests" reveal: returns only the reports
  # associated with the authenticated caller (a mechanic sees the reports
  # assigned to them), so it is the caller-scoped ownership reveal for the
  # service_report object. Each report is a distinct instance keyed by its `id`
  # — the same identifier the BOLA endpoint below consumes as `report_id`.
  - method: GET
    path: /workshop/api/mechanic/service_requests
    content_type: application/json
    returns:
      - type: service_report
        sensitivity_tier: 2
        ownership:
          reveal_path: /workshop/api/mechanic/service_requests
          reveal_method: GET
          requires_session: true
          # Caller-scoped: no owner_field — a 2xx reveal means the authenticated
          # caller owns the reports returned to them. `id` keys each instance, so
          # two callers owning two reports get two distinct object nodes (Task 7).
          instance_key_field: id
          # crAPI wraps the report list under this key ({"service_requests": [...]})
          # rather than returning a bare array, so the mapper unwraps it first.
          items_field: service_requests

  # The BOLA target: any authenticated user can read *another* principal's
  # mechanic report by its report_id. Read-only; the report_id is the instance
  # key the reveal above discovered. Cross-user reads are confirmed in Task 7.
  - method: GET
    path: /workshop/api/mechanic/mechanic_report
    content_type: application/json
    parameters:
      - name: report_id
        location: query
    returns:
      - type: service_report
        sensitivity_tier: 2

  # Contacting a mechanic creates the report — state-changing, so recon never
  # fires it; the report it produces is what the BOLA above then reads (Task 7).
  - method: POST
    path: /workshop/api/merchant/contact_mechanic
    content_type: application/json
    state_changing: true
    parameters:
      - name: mechanic_code
        location: body
      - name: vin
        location: body
      - name: problem_details
        location: body
      - name: mechanic_api
        location: body
